name: CI

on:
  push:
  pull_request:

jobs:
  # Matrix ruling: `engines.node` (">=20") is the RUNTIME floor for the shipped
  # `dist/cli.js`, not the dev toolchain. vitest 5.1 requires Node
  # ^22.12 || ^24 || >=26, so a test job on Node 20 would be red on day one
  # without anything being broken. Node 20 is covered by `node20-smoke` below,
  # which exercises the built artifact — exactly what engines promises.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # The engines floor: build the package with the modern toolchain, then run
  # the SAME artifact under Node 20 (the setup-node switch below replaces the
  # PATH) — boot the CLI, check /api/state JSON, the built UI and the
  # local-Host guard. No typecheck/test here: they belong to the toolchain
  # job above.
  node20-smoke:
    name: node 20 runtime smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Use Node 24 (dev toolchain)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Switch to Node 20 (engines floor)
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/smoke.mjs
